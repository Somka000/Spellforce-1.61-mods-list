; Forest Elves - ustawienia moda
; Plik musi lezec obok forest_elves.sfm w folderze SpellForce\sfsf.

[ForestElves]
Enabled=1

; 1 = obejmuje elfickie jednostki wojskowe utworzone z run
IncludeMilitary=1

; 1 = wlacza gwiazdke i premie dla wojskowych elfow AI/mapy bez runy,
; w tym wrogich elfow ras 134, 144, 163 i 192.
; 0 = nie rozszerza gwiazdki na te frakcje i nie daje im premii.
AffectEnemyElves=1

; 1 = zapisuje do sfsf.log wykryte elfy i zmiany stanu FOREST_SPIRIT.
; W wersji finalnej diagnostyka jest domyslnie wylaczona.
DebugLog=0

[Bonuses]
; Stale punkty statystyk, a nie procenty. Dozwolone wartosci: 0-100.
; Kazda premie mozna ustawic osobno. 0 oznacza brak danej premii.
Armor=5
Agility=5
Charisma=0
Dexterity=5
Health=0
Intelligence=0
Mana=0
Stamina=0
Strength=0
Wisdom=0
ResistanceFire=0
ResistanceIce=0
ResistanceMental=0
ResistanceBlack=0
WalkSpeed=10
FightSpeed=5
CastSpeed=5
