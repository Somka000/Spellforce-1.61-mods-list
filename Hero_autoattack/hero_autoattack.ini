[AggressiveAvatar]
; Distance (tiles) at which the avatar proactively picks a fight with the
; nearest hostile. Targets beyond this can still be engaged by the engine's
; own battle logic (sight range). Default: 13
AggressionDistance=13

; When an allied unit is hit by an enemy within this radius (tiles) of the
; avatar, the avatar moves to defend it. Default: 20
AllyDefenseRadius=20

; Diagnostic logging into sfsf.log (job tracer, per-tick combat state, order
; classification, ghost-watchdog reports). Leave at 0 for normal play; set to
; 1 only when collecting a log for a bug report. Default: 0
DebugLog=0

; CRASH BREADCRUMBS - diagnostic only, leave at 0 for normal play.
; 1 = write one short [bc] line per hook entry/leave and before every engine
; call the mod makes. SFSF's logger closes the file after every line, so the
; LAST [bc] line in sfsf.log is guaranteed to be on disk even if the game dies
; the instant afterwards - that is what makes it possible to say where control
; was lost. Costs roughly ten file opens per tick, so it is not free.
;   e h4 / x h4        - entered / left the AI tick hook
;   h4.orig / h4.post  - around the engine's own original; a missing .post
;                        means the fault is INSIDE the engine, not in mod code
;   h6.sweep, wd.*     - the load sweep and the ghost-tower repair calls
TraceCalls=0
