# Graphics Tweaks; read when the game starts
# Shadow map resolution: 1024 (the game's own), 2048, 4096 or 8192
shadow_resolution = 4096
# Softness of the shadows' edges, in texels of the shadow map: 1 (the sharpest) to 8; 2 and
# up use a wider filter that moves the edges in smaller steps as the sun turns
shadow_softness = 1.00
# Size of the area with detailed terrain textures: 14 (the game's own) to 24; larger sizes
# shrink to what fits
terrain_detail = 22
