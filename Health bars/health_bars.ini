[health_bars]
; Health bars always shown over (1 = yes, 0 = no):
Own=1
Allies=1
Enemies=1
; your workers (woodcutters, miners, ...), when Own=1
Workers=0

; 1 = only figures that have lost health
OnlyDamaged=0

; Only figures within this distance of your main character (0 = no limit)
MaxDistance=0

; Key that switches the bars on and off in game: a Windows virtual-key code,
; e.g. 0x48 = H, 0x75 = F6 (0 = no key, always on)
ToggleKey=0

; 1 = enemy bars in red (the colour of an almost empty bar), 0 = game colours
RedEnemies=1
; 1 = your bars and allied bars always green (full bar colour), 0 = game colours
GreenOthers=1

; Read when the game starts.
