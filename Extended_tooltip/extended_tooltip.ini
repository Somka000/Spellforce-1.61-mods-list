[ExtendedTooltip]
; =====================================================================
; Extended Tooltip 1.38.0 - complete configuration.
; Every key the mod reads is listed here, so nothing silently falls back
; to a default.
; =====================================================================

; ---------- Tooltip content (normal gameplay features) ----------

; Append the attribute line (STR STA DEX AGI INT WIS CHA).
ShowStats=1

; Append the resistance line (fire / ice / black / mind, colored).
ShowResistances=1

; Append the speed line (Run / Fight / Cast).
ShowSpeeds=1

; Append the armor line: armor value plus the physical damage reduction
; percent (engine-exact formula: armor/(armor+100)).
ShowArmor=1

; Append the per-hand DPS line (melee/ranged) with the weapon damage type.
ShowDPS=1

; Append the per-figure vision range line (engine GetSightRange).
ShowVision=1

; Append the kill rewards line: Experience and Cash for enemies, Corpse
; meat for every unit that has any.
ShowRewards=1

; Avatar only: append "Experience: current / next level threshold".
ShowAvatarXP=1

; 1 = show the natural regeneration rate in brackets behind Life and Mana,
; on the live portrait AND in the monument's production tooltip (default):
;
;   Life: 355/355 (7)
;   Mana: 46/46 (5)
;
; The numbers are the engine's own regeneration tick, read out of the listing
; rather than fitted to observations - the sweep that heals with a NEGATIVE
; SubHealth / SubMana, life at .text:00701607 and mana at .text:00701707:
;
;   life = STA_current * level / 150 + 1
;   mana = (INT_current * 10 + level * 20) / 100
;
; Note the mana RATE runs off INT while the mana POOL right above it runs off
; WIS (RescaleLevelStats -> AC34::FUN_00717b70). That is the engine, not a
; typo, and deriving the rate from the pool formula would be wrong for every
; caster in the game.
;
; What is shown is the BASE rate. The tick also applies three live modifiers
; that are deliberately left out: a per-figure state byte raises both rates by
; 50%, FOREST_SPIRIT raises mana by another 50%, and both are finally clamped
; to what is actually MISSING - so a unit at full health would read 0. The
; first two are recomputed from the unit's surroundings every tick and would
; make the number flicker under the cursor; the clamp would turn a rate into a
; remainder. The base rate is also exactly what the 1.54-era extended_ui
; tooltip printed: its level 14 Hurler with STA 71 shows (7) = 71*14/150 + 1.
;
; 0 = plain Life / Mana values with no brackets.
ShowRegen=1

; Where the chance to hit, BOTH DIRECTIONS, is shown:
;   0 = nowhere.
;   1 = in the framed strip on the bottom panel, the same one the tower block
;       uses (default). Appears when you SELECT a unit:
;
;         bardzo zly vs Grarg Firemaster
;         Melee vs Ranged
;         Chance to hit: 82% attacking, 39% being attacked
;
;       The middle line says what kind of fight each side brings. Rangedness
;       is a WEAPON TYPE property (12 bow, 13 crossbow), never a reach value -
;       the same rule the DPS line uses, and v1.6.2 records what taking it
;       from max_rng did instead. A unit carrying both says "Melee+Ranged".
;
;       IMPORTANT, so the line is not misread: the percentage is the SAME for
;       melee and ranged. CGdFigureJobs::HandleOnHit resolves both kinds of
;       hit and calls the chance function once, passing only the two figures -
;       there is no weapon argument in it at all. So the middle line is a
;       label on the matchup, not a second number.
;
;       The two blocks share one set of labels and one placement, and cannot
;       collide: the panel shows either a building or a figure, never both.
;       All the TowerInfo* keys below (X, Y, Font, LineH, AlignBar) position
;       this block too. ShowTowerInfo=0 no longer takes it away.
;   2 = appended to the portrait tooltip instead, which is how 1.39 shipped
;       it. Use this if you would rather read it on hover than on selection.
;
; The header says which side each number belongs to - the first name is the
; one doing the attacking in "82% attacking". Both names come from the
; engine's own AC95 name builder, the same call SFSF uses for the first line
; of this tooltip, so they cannot disagree with it - and heroes and the avatar
; keep their PERSONAL names ("bardzo zly"), which a unit-record lookup would
; have replaced with the unit type ("Dark Elf Deathknight").
;
; The number is the engine's own. AutoClass34::FUN_00717860(ac34, attacker,
; target) has no name in the listing - what identifies it is the attack
; resolver, which does "if (chance < Random(100)) -> miss", so it cannot be
; anything else. The 1.54-era extended_ui called this same function to print
; its own "Chance to hit" line, so both sides agree on what it is.
;
; WHO IS COMPARED WITH WHOM. One side is the unit whose tooltip this is. The
; other is OUR side, and it cannot be read from the live selection at the
; moment the tooltip is built: seeing an enemy's tooltip means the enemy is
; selected, so the selection points at the enemy and our side would vanish.
; It is therefore latched, from two sources:
;
;   * THE PANEL SELECTION, refreshed every tick while one of YOUR units is
;     selected. This is what makes "select the avatar, then click the enemy"
;     work. It has to run on the tick because selecting a unit never builds a
;     tooltip at all - the panel's own name and level labels are written by
;     CUiMainDetailView, not by the builder this mod chains. Ownership is
;     checked against the local player, so selecting the enemy cannot
;     overwrite our side.
;   * THE LAST OWN UNIT THE BUILDER SAW (its p4 variant flag marks
;     own/allied). Fallback, and the only one that can hold an ALLIED unit of
;     another player, since such a unit fails the ownership test above.
;
; So: select your unit, then click the enemy - the enemy's tooltip carries
; both numbers, and it follows the selection from then on.
;
; Nothing is shown when the two are the same unit, or when the latched unit
; has died since (both re-checked on every build).
;
HitChanceMode=1

; 1 = show the Mana line on tooltips that normally have none, i.e. ENEMIES and
; allies (default).
;
; The engine picks the tooltip variant with three flags and only sets the mana
; one (p4) for your OWN units - that is what v1.20.3 established when the same
; flag turned out to mark own/allied. So an enemy caster's tooltip listed its
; spells while saying nothing about the mana to cast them with, and the allied
; short variant, which this mod promotes to the enemy layout anyway, had none
; either.
;
; Nothing is rewritten to fix that: SFSF's builder already assembles the line
; from the figure itself and only asks whether the flag is set, so the mod
; raises the flag before calling it. The relayout below counts the leading
; lines from the same effective flags, so it follows automatically.
;
; A unit with no mana at all is skipped rather than shown as "Mana: 0/0".
;
; 0 = leave the variant flags as the engine passed them.
ShowMana=1

; 1 = the Experience figure in the rewards line is the EFFECTIVE amount the
; next kill will actually pay, after the game's experience falloff (default).
;
; FIXED IN 1.28.0. The falloff arithmetic was always right; what was wrong was
; the variable driving it. The engine (AutoClass6::FUN_00625ca0, sender of net
; message 0x1f68) computes:
;   n  = CDbLocal::vfunction81(player, unit_id)
;   if (n > falloff*10) -> 0
;   XP = base*10000 / ((n*100-100)/falloff + 100) / 100
; and vfunction81 (VA 0x0064f440) is NOT a level getter - it is a
; per-(player, unit id) KILL COUNTER it increments and returns. So the falloff
; is driven by how many of that unit type YOU have already killed, and it is
; persistent across saves. Up to 1.27.x the mod fed it the avatar level, which
; produced numbers that declined plausibly but tracked the wrong thing.
;
; Field log that settled it (avatar level 11 for the whole run, falloff 50):
;   Gnarled Treant, base 38: tooltip said 31, the kill paid 38 - full base,
;     because it was the first one ever killed (n=1).
;   Treewraith, base 21: paid 18, 17, 17, 17, 16, 16, 16 in a row at an
;     unchanged level. A level-driven formula gives a constant; that sequence
;     is exactly f(n) for seven consecutive n.
;
; A unit type you have never killed shows the full base, which is correct - the
; engine inserts the counter at 1 for the first kill.
;
; 0 = show the raw base value with no falloff applied. Diagnostic only; it is
; also what the mod falls back to on its own if the counter map cannot be
; reached, since the un-decayed base is the only honest answer without n.
RewardsXPFalloff=1

; Production tooltip (unit-to-produce in a monument): append Level, Armor,
; Stats, Resistance, Speed and per-hand DPS.
ShowProduction=1

; Production tooltip: append "Production time: N.N seconds" (engine value,
; shrinks with every extra matching production building).
ShowProductionTime=1

; 1 = arrange the monument's production tooltip like the 1.54-era extended_ui
; mod (default): unit name, then our stats, then a titled section per weapon
; hand, then the engine's own production block last under a "Production"
; header with "Production time" beside the cost it refers to.
;
;   Scout
;   Level / Life / Mana / Armor / Stats / Resistance / Speed
;   Melee combat
;     Damage type: 100% blunt
;     Damage: 2-4 (1-1) every 1.2 s        <- brackets = raw item damage
;     DPS: 2.4 (0.8)                       <- brackets = unscaled DPS
;   Ranged combat
;     ... plus Range: 2-13
;   Production
;     Resources: Wood 40, Iron 15          <- these four are the ENGINE's own
;     Building: Smithy                        lines, only moved down here
;     Produced: 1
;     Production time: 8.0 seconds         <- ours
;
; How the move works, since it is the one part that could look fragile: the
; engine builds this tooltip in a fixed order (FUN_009d93d0) and always emits
; the unit name first, followed by a newline, then the production block. So
; the mod cuts at the FIRST newline and puts everything after it back at the
; end. No label text is ever matched - "Resources" and the rest are text ids
; (0x127e, 0x1143, 0x1280), so this works in every language. If the string has
; no newline or is longer than the buffer, the mod changes nothing and you get
; the vanilla order back.
;
; 0 = the pre-1.29.0 layout: everything appended after the engine's block, and
; both weapon hands compressed into one line, "DPS: 2.4 (melee, 100% blunt)
; 2.2 (ranged, 80% cutting)".
ProductionLayout=1

; 1 = repair the LEFT hand's attack interval on the live portrait (default).
;
; This one patches somebody else's output, so it is worth knowing why. SFSF's
; portrait hook builds both weapon lines, and its left-hand call passes the
; RIGHT hand's weapon type as the is_ranged flag:
;
;   sf_vanilla_fix_hook.c:1178   ... r_item_id, dual_wield, (r_type == 12)
;   sf_vanilla_fix_hook.c:1268   ... l_item_id, dual_wield, (r_type == 12)
;                                                            ^^^^^^ should be l_type
;
; is_ranged ADDS a flat penalty (~0.7 s) instead of scaling, so a unit with its
; bow or crossbow in the LEFT hand and a melee weapon in the right loses that
; penalty and the portrait shows an interval that is too fast. Measured:
; Scout 1.7 s instead of 2.4 s, Wanderer 1.8 s instead of 2.5 s. The vanilla
; builder uses each hand's own type (0x9d0f1a reads l_item_id's), and so does
; this mod - which is why the monument tooltip and the portrait disagreed.
;
; The repair does NOT match a text pattern. It renders both the wrong and the
; right string here, through the same localized format SFSF used (description
; 4803 plus ", ", seconds as a double), so they are identical to what is on
; screen in any language, and replaces the LAST occurrence - the right-hand
; line is printed first and is computed correctly.
;
; Failure mode is nothing at all: no difference between the two values, or no
; match in the text, means no edit. It also does nothing for units whose hands
; are both melee or both ranged, since the mixed case is the only one the slip
; changes.
;
; Reported upstream. DELETE THIS KEY once SFSF ships the one-word fix, and
; re-check it after every SFSF update - it is a text substitution on another
; mod's output, which is exactly the kind of thing that rots silently.
;
; 0 = leave SFSF's number alone.
FixOffhandSpeed=1

; Runeboard: append the hero rune's spell list with each spell's rank.
ShowRuneSpells=1

; Append the spell's own rank to the spells listed in the PRODUCTION tooltip,
; e.g. "Pain Level 5" - the same suffix the runeboard has always shown. The
; rank comes from CGdResourceSpell::skill_requirements (four triples of
; school/subschool/level; the rank is the level of the first triple, values
; above 99 mean "no requirement").
; NOTE: this deliberately breaks the old rule that the production tooltip
; matches the live portrait line-for-line. The portrait's spell list is built
; by the engine, not by this mod, so it carries no rank yet - adding one there
; needs a hook on the engine's own spell formatter.
ShowSpellLevel=1

; 1 = mark a live unit that IS the upgraded variant of its army unit (default).
;
; Upgrading an army building does not convert the units already produced, so
; after researching an upgrade you have both variants walking around at once -
; and the game shows no difference at all. That is not a guess: unit 559 and
; unit 1248 carry different name ids (2255 and 21714) whose text is the same
; word, "Veteran". Only the editor-side handle separates them ("Unit Orc
; Veteran" vs "Unit Orc Veteran Upgrade"), and that is never on screen. Same
; story for 548 / 1435, both called "Wintermage".
;
; The engine's CGdFigureToolBox::getUpgradedUnitID answers the FORWARD question
; only - it turns a base id into its upgraded id when the player has the tech.
; Asked about a live figure's own id, an unchanged answer means "this unit has
; no upgrade" OR "this already IS the upgraded one", and one call cannot tell
; those apart. So the mod builds the reverse map: the raw listing shows the
; function is a switch over ids 538..584 (SUB 0x21a / CMP 0x2e / JA), 36 of
; those 47 slots populated, with targets at 1223..1299 plus 1435 - all outside
; the switch range, which is exactly why feeding an upgraded id back in changes
; nothing. Running those 47 ids through the engine's own function and collecting
; what comes back identifies every upgraded variant, with no hardcoded table.
;
; The scan asks about the FIGURE'S OWNER, so the failure mode is a silent miss,
; never a false mark: an enemy carrying an upgraded variant it never researched
; (a map-placed unit) finds nothing and simply goes unmarked. Your own army,
; which is what this is for, is always correct.
;
; With DebugLog=1, one line per figure:
;   tt upg fid=383 uid=1248 owner=1 researched=3 MARKED
; "researched" is how many upgrades that owner actually has; 0 there means the
; owner has researched nothing, so nothing can be marked.
;
; 0 = leave the name alone.
ShowUpgraded=1

; The text appended to the name line of an upgraded unit.
;
; Free text so it can be translated without a rebuild. Inline colour codes work
; (%cRRGGBB opens, %d closes) because the value is inserted as DATA, never as a
; format string - so a stray % cannot break anything either. The default greys
; the marker so it reads as an annotation rather than as part of the name.
;
; It lands at the END OF THE FIRST LINE, after SFSF's "(Level N)" - i.e.
; "Veteran (Level 14) (upgraded)". That position is structural, not a text
; match: SFSF's portrait hook emits the name block and then a newline before
; anything else, so the first newline is the end of the name line in every
; language. Leave the value empty to disable the marker.
;
; KEEP THE DOUBLE QUOTES. GetPrivateProfileString trims leading and trailing
; whitespace but discards surrounding quotes and preserves what is inside them,
; so the quotes are the only way to keep the separating space before the "(".
; Without them the marker glues itself to the level: "Veteran (Level 14)(upgraded)".
UpgradedMarker=" %cdddddd(upgraded)%d"

; 1 = relay the LIVE portrait tooltip so the stat lines sit directly under
; Life/Mana instead of below everything else (default).
;
;   Veteran (Level 14) (upgraded)     <- SFSF's, untouched
;   Life: 355/355                     <- SFSF's, untouched
;   Mana: 46/46                       <- SFSF's, untouched
;   Armor / Stats / Resistance / Speed / DPS / Vision range     <- ours
;   Damage: 2-4, 1.2 s, Range 2-13    <- SFSF's weapon lines, only MOVED
;   Effect: ...                          down here, wording unchanged
;   Spells ...
;   Rewards for killing ...           <- ours, still last
;
; Nothing is rewritten and no label text is matched - the tail is cut off, our
; lines are appended in its place, and the tail goes back on further down.
;
; The cut is exact because the line count is something the mod DECIDES rather
; than discovers. SFSF's portrait hook gives each variant flag its own block:
; p3 owns the "(Level N)" suffix and the Life line, p4 the Mana line, p5 the
; weapon/effect/spell tail. Every block after the first begins with a newline,
; and the Life/Mana builders contain none of their own. So the boundary is the
; K-th newline with K = 1 + (p3?1:0) + (p4?1:0), taken from the flags this mod
; itself passed to SFSF - including the ally promotion, which rewrites them.
;
; Fails safe: if that newline is not there, or nothing follows it, or the tail
; is too long, the mod changes NOTHING and you get the old order. The cut also
; sits after the last early return in the wrapper and there is no return
; between it and the restore, so no path can drop the weapon and spell blocks.
;
; Known cosmetic limits of this variant, both deliberate:
;   - Level stays inside the name line as "(Level 14)" rather than being a line
;     of its own, because the Life/Mana lines are SFSF's and come as they are.
;   - The weapon lines keep SFSF's dense one-line-per-hand form instead of
;     being split into "Melee combat" / "Ranged combat" sections. FixOffhandSpeed
;     is therefore still needed and still applies.
;
; 0 = the pre-1.32.0 order (our lines appended after everything SFSF emits).
PortraitLayout=1

; Diagnostic staging of the rewards block (only relevant while debugging):
; 0 = block fully off, 1 = pointer-chain reads only, 2 = also the tree
; lookup and record reads, 3 = full including the tooltip line (default).
RewardsStage=3

; ---------- Stage B: effect timers on the portrait ----------

; 1 = show the remaining seconds of every timed effect (buffs, DoTs, auras)
; directly on the engine's own portrait effect icons.
RenderEffects=1

; 1 = ENGINE-DRIVEN mode (recommended, and the default since 1.22.0). The
; mod reads the portrait panel itself: which figure it is showing, which
; icons are lit, which spell sits in each icon and where that icon is on
; screen. Nothing needs tuning and nothing needs to be told apart by hand -
; the left/right split, the ordering and the four-icons-per-side cap all
; come from the engine, so the numbers always match the icons you see.
; 0 = legacy mode: the mod draws its own two columns at the EffectsX /
; EffectsY / EffectsSpacing / EffectsRightX positions below and decides
; positive vs negative itself (by asking whether the effect's source is
; hostile to the unit carrying it).
EffectsAutoPos=1

; Where the timer number sits relative to its buff icon.
;   0 = CENTRED on the icon (recommended since 1.24.0). The label's box is now
;       only as big as the number itself, so the whole ring around it still
;       answers the engine's own hint - the one that names the spell and says
;       whether it is positive. Only the glyphs block, and that cannot be
;       fixed with engine controls at all.
;   1 = BESIDE the icon, just past its right edge. The hint then has the
;       entire tile back. Use this if you want the icon completely untouched.
; Vertical centring on the tile applies in both modes.
;
; Before 1.24.0 the box stayed ICON-sized and was merely SHIFTED to centre the
; text, so it overhung the icon's right and bottom edges and left thin strips
; on the left and top - and those strips were the only place the hint answered.
; That is what made mode 1 feel necessary; it no longer is.
; An icon with no timer now gets no label at all (empty string, box collapsed
; to 0x0, VISIBLE cleared), so an unused slot never sits in the way.
EffectsPlacement=0

; 1 = show no timer on a summon's portrait icon (default).
;
; Same reasoning as CooldownHideSummons on the bottom bar: the icon is there for
; as long as the creature is, not for the number of seconds in the spell's
; timer, so a countdown on it says nothing. The mod asks the engine's own
; predicate (CGdSpell::IsSummonSpellLine) rather than carrying a list.
;
; The icon carries a spell ID while the predicate wants a spell LINE, so the
; spell is resolved through the resource first - the bar needs no such step,
; because its slot rows hold the line directly.
;
; Applies to the EffectsAutoPos=0 layout as well.
; 0 = show the timer on summons too.
EffectsHideSummons=1

; 1 = show no timer on an aura's portrait icon (default).
;
; Same as summons, and the same as CooldownHideAuras does on the bottom bar: the
; icon is there for as long as the aura is switched on, so a countdown on it
; says nothing. Uses the engine's own CGdResource::GetSpelllineIsAura, which
; reads the aura flag out of the game data rather than comparing against a list
; of line ids - so it stays correct for modded lines too.
;
; Applies to the EffectsAutoPos=0 layout as well.
; 0 = show the timer on auras too.
EffectsHideAuras=1

; 1 = damage-over-time spells show their WHOLE remaining run (default), not the
; time left in the current tick.
;
; Fireburst and friends restarted their countdown on every tick, because the
; field the timer reads (to_do_count) really is just the current interval for
; these spells - the engine re-arms it after every tick:
;   if (params[2] < tick_count) the effect ends
;   else  to_do_count = params[3] converted to ticks;  tick_count += 1
; So params[2] is how many ticks the spell gets, params[3] the interval, and the
; mod adds the unfired intervals back on to get the full remaining time - which
; is what the spell description's "over N seconds" refers to.
;
; APPLIED ONLY TO SPELL JOBS WHOSE HANDLER HAS BEEN READ - currently Fireburst,
; Poison and Icestrike1. This is not caution for its own sake; the handlers
; genuinely disagree with each other, and assuming otherwise was wrong twice:
;   Fireburst   budget params[2]  interval params[3]  counter UP, re-arms <= N
;   Poison      budget params[2]  interval params[1]  counter UP, re-arms <  N
;   Icestrike1  NO budget param   interval params[1]  counter DOWN to zero,
;                                 and that same counter is the damage dealt
; For a down-counting spell "budget minus counter" GROWS as the effect runs,
; which is why the ice DoT looked like it reset after every tick.
;
; A job with no entry keeps the raw per-tick value AND is logged, so the next
; one can be added from evidence rather than from looking similar:
;   [eff] over-time UNMAPPED job=98 spell=1234 tick_left=8 counter=3 ...
; Send that line for any DoT that still misbehaves - the job id is what is
; needed to go read the right handler.
;
; Correct ones log as:
;   [eff] over-time spell=3888 job=1 tick_left=14 -> total=54
;
; NOTE, and it is the engine's doing, not the mod's: Fireburst runs ONE INTERVAL
; LONGER than its own description claims. A tooltip saying "over 4.0 seconds"
; with 4 ticks of 1.0 s actually ticks five times over 5.0 s, because the
; handler re-arms while the counter is <= the budget. The timer shows the real
; remaining time, so it starts at 5.0 rather than 4.0 and ends exactly with the
; effect instead of stalling on the last second.
;
; 0 = show the raw per-tick value.
EffectsOverTimeTotal=1

; Nudge the number in either mode (pixels).
EffectsOffsetX=0
EffectsOffsetY=0

; Pin the timers to ONE figure instead of following the portrait. 0 = follow
; the selection (normal). Set it to a figure's "Id #" only for testing.
; NOTE: no longer required for RenderEffects - since 1.22.0 the selected
; figure is read from the panel itself (CUiMainDetailView+0x38c).
ProbeFigureId=0

; Fallback layout, used only when EffectsAutoPos=0. Coordinates are LOCAL
; to the HUD panel (which is 857 x 167). For reference, the engine's own
; icons sit at x=6 (positive) and x=141 (negative), are 26 x 26 and are
; stacked with a pitch of 29 - the defaults below match that.
;   EffectsX / EffectsY = position of the first row of the left column
;   EffectsSpacing      = vertical distance between rows
;   EffectsRightX       = X of the right column (negative effects)
EffectsX=6
EffectsY=8
EffectsSpacing=29
EffectsRightX=140

; CORRECTED in 1.22.2: the label does NOT centre its text in the box - it
; anchors it to the box's left edge. (Measured: the box was confirmed to sit
; exactly on the icon, to the pixel, and the number still hugged the left.)
; Since 1.22.2 the mod centres the number itself, by reading how wide the
; engine actually rendered the current string and shifting the box by half
; the leftover. So these two are only the size the labels are created with;
; in engine-driven mode the box is re-fitted to the icon anyway.
EffectsWidth=16
EffectsHeight=16

; Font of the timer numbers: an engine font index. VALID RANGE IS 0..15.
;
; Do not go above 15. The struct has room for 32 fonts and SFSF only rejects
; an index above 32, but font 16 crashes the game on the first attach (this
; was found the hard way, twice). The mod now clamps anything above 15 back
; to 6, so a typo here is harmless.
;
; With DebugLog=1 the mod reports what the chosen font actually rendered, in
; <module>.cooldown.log:
;   [eff] EffectsFont=6 renders '18' as 20.00 x 22.00 on a 49x36 tile
; The tile is 49x36, so a font height up to ~34 still fits.
; Takes effect on the next game start - the labels are created once.
;
; Measured so far. Sizes are for the sample "88.8"; height is what tracks
; the actual font size, width also depends on the string:
;   font 0 -> 32 x 12
;   font 1 -> 38 x 24   WHITE, bold - biggest of the first eight
;   font 2 -> 32 x  0   height not reported by the engine for this one
;   font 3 -> 32 x  0   likewise
;   font 4 -> 38 x 22
;   font 5 -> 36 x 20
;   font 6 -> 38 x 22   the old default, WHITE
;   font 7 -> 36 x 20
;   font 9 -> 18 x 20 for "18"  BLACK
; Fonts 8..15 were shown on screen but their measurements were lost: the log
; is wiped per launch and the crashed base=16 run overwrote them. Re-run with
; EffectsFontProbe=8 if the numbers are wanted again.
; The index is not a size. It selects a whole font resource - typeface, size
; and colour together - so the only way to choose is to look at samples.
EffectsFont=8

; DEBUG ONLY. Lays eight sample labels reading "88.8" across the portrait
; area, using fonts base..base+7, so you can see size and colour side by
; side in one run; their measured sizes also go to the cooldown log.
; Two runs, base 0 and base 8, cover every font that exists.
; 99 = off (a plain "0" is a valid base, so off cannot be 0 or -1).
; Leave this at 99 for normal play: the samples stay on screen for the whole
; session, because SFSF never registers a way to destroy a label.
EffectsFontProbe=99

; ---------- Stage A: recast countdowns on the bottom bar ----------

; 1 = show the remaining recast seconds on the ten bottom-bar spell buttons.
;
; SOLVED IN 1.23.0. The hero's recast is NOT on the figure - the avatar's 15
; action slots only ever hold its two weapon hands, which is what made the
; last two sessions come up empty. The bar's own spells come from the
; UiDbProxy, and so does their cooldown: a ready-tick stamp at
;   UiDbProxy + 0x10FF4 + slot*0x10 + 0x0C   (UiDbProxy = *(CUiMain+0x7440))
; and remaining = stamp - current_step, in tenths of a second. That is the
; exact value the engine itself compares against current_step to decide
; whether the button is clickable, so the number can never disagree with the
; greying you see.
RenderCooldowns=1

; Font of the countdown numbers. Same index space, same 0..15 limit and the
; same crash above 15 as EffectsFont - see the long note there.
CooldownFont=8

; Where the number sits on its button. Since 1.23.2 the label's box is only as
; big as the rendered number in BOTH modes, so the rest of the tile always
; answers the mouse; this key only chooses where that small box goes.
;   0 = CENTRED on the tile (default).
;   1 = the tile's BOTTOM-RIGHT corner, which also frees the middle of the
;       button. Use this if a greyed button still needs its hover text right
;       in the centre.
; When the spell is ready the label is collapsed to 0x0 and its VISIBLE bit is
; cleared, so it is completely out of the way.
;
; Two bugs lived here, both worth remembering:
;   1.23.0 parked a full-tile box over every button permanently, with a SPACE
;   as its text - the whole bar became unclickable.
;   1.23.1 centred by SHIFTING a full-tile box, so it overhung the tile's
;   right and bottom and left thin strips on the left and top - and those
;   strips were the only place the hover text still answered.
; If anything like that comes back, this key and CooldownAutoPos are the two
; to reach for.
CooldownPlacement=0

; 1 = fit each number to its button's live rect and centre it (default).
; 0 = leave the label where it was created. This is an escape hatch: the
; buttons carry two rects in two different coordinate spaces (+0x134 in
; screen pixels, +0x24c in the 857x167 UI space) and the labels are created
; from the second but re-fitted from the first. If the numbers ever land
; somewhere odd, set this to 0 and read the "[bcd] btn N rect134(...)
; rect24c(...)" lines in <module>.cooldown.log.
CooldownAutoPos=1

; 1 = hide the flat 2 second post-cast lock (default), so only real per-spell
; recasts get a number.
;
; Casting ANY spell stamps ALL TEN slots with a fixed 2.0 s lock - one field
; sample had slots 0-8 at step+19 while slot 9, the spell actually cast, was at
; step+329. Drawing that put a pointless "1.9" on the whole bar after every
; single cast.
;
; It cannot be filtered by the remaining time alone, because a real recast
; counts down through those same values. So the mod uses the spell record: a
; spell's own recast in ticks is recast_time/100 and the lock is exactly 20
; ticks, therefore a slot is hidden when its spell cannot outlast the lock, and
; any remainder of 2.0 s or less is hidden too (that is what a long-recast slot
; gets written over it when some other spell goes off).
;
; Deliberate consequence: the number disappears for the last 2 seconds of a
; long recast. The button stays dark on the lock during those 2 seconds anyway,
; and nothing in the data tells the two apart - so nothing is claimed.
;
; 0 = show every stamp, including the lock. Diagnostic only.
CooldownHideGlobalLock=1

; 1 = show no numbers until the CAST has finished (default).
;
; The recast stamp is armed when the cast BEGINS, so without this a spell with
; a long cast animation starts counting down while the avatar is still casting
; it. Cast times differ per spell, so nothing fixed can be subtracted - instead
; the mod asks the engine the same question the engine asks itself when it
; greys the whole bar: CGdFigureJobs::IsFigureJobSpell. That is true for
; exactly as long as the cast lasts, for every spell.
;
; SIDE EFFECT, which is why this is a switch: it hides ALL the numbers while
; casting, so a long recast already counting down on another slot blinks out
; for the length of the cast. The whole bar is grey and unclickable during that
; window anyway. Set to 0 if you would rather keep the other countdowns visible
; and accept a number appearing during the cast.
CooldownHideWhileCasting=1

; 0 = show the recast countdown on summon spells too (owner's preference since
; 1.25.3, and the default).
;
; Set to 1 to hide them. The caveat that made hiding the first choice still
; stands, so it is worth knowing: a summon's button is held for as long as its
; creature is alive, NOT for the recast in the stamp. So the number counts down
; to zero while the button stays dark, and the button then lights up the moment
; the summon dies with no warning from the timer. Knowing the recast is still
; useful, which is why it is shown - just do not read it as "the button is about
; to come back".
;
; Auras are a separate key, CooldownHideAuras, and are still hidden.
;
; The mod does not carry a list of summon lines - it asks the engine's own
; predicate, CGdSpell::IsSummonSpellLine, with the spell line the bar row
; already holds.
CooldownHideSummons=0

; 1 = show no countdown on aura spells (default).
;
; Exactly the summon case: an aura's button is held for as long as the aura is
; switched on, not for the recast in the stamp, so the number would count down
; to zero on a dark button and then say nothing when you switch the aura off.
;
; The predicate here is even better than the summon one - the engine's
; CGdResource::GetSpelllineIsAura compares against no list at all, it looks the
; spell line up in the game data and reads its aura flag. So it stays correct
; whatever the data says, including modded lines.
;
; 0 = show the stamp on auras too.
CooldownHideAuras=1

; Nudge the countdown (pixels).
CooldownOffsetX=0
CooldownOffsetY=0

; 1 = show how many creatures of a summon spell you currently have out, as a
; second number on that spell's bar button (default).
;
; This is the number that button was missing. CooldownHideSummons' own note
; says it: a summon's button is held dark for as long as its creature is ALIVE,
; not for the recast in the stamp, so the recast counts down to zero under a
; button that stays dark and then lights up with no warning when the creature
; dies. The count says what is actually holding the button. The two cannot
; disagree either, because they come from the same fact - the button is dark
; precisely while that spell instance is active.
;
; One active spell = one live creature, and that is from the data rather than
; assumed: every variant of a summon line reads params [interval, mana, unit
; type, 0] with NO count field (Summon Ice Golem: 10000, 15, 3529, 0), which is
; also exactly how the deployed controlled_summons handler reads them, and the
; in-game description agrees - "Consumes {[1]} mana per {[0]:3,1} seconds".
;
; How it counts, and why it is not the cheap way: walking the active spell
; array directly would be faster, but nothing here knows how the engine marks a
; slot in that array FREE, and reading a stale row would invent summons out of
; nothing. So it walks the owner's figures and asks the engine's own per-figure
; spell list instead (the same chain the portrait effect timers use), which by
; construction contains only LIVE spells. A summon carries the very spell that
; created it, so the creature is where the evidence is.
;
; COUNTED PER SPELL, NOT PER LINE (fixed in 1.33.1). A bar holding Summon
; Skeleton level 4 AND level 5 first showed the same number on both buttons,
; because those two are one spell LINE. They are different spells and they
; summon different creatures - every variant of a summon line carries its own
; unit type in params[2] (Summon Ice Golem: 3315, 3316, 2254 ... 3529, one per
; level). So each button counts only the creatures ITS OWN variant made. The
; bar row carries both keys, the line at +0x00 and the spell at +0x02.
;
; A slot with no summons shows nothing at all - an empty box, so it cannot
; block the mouse on that button.
;
; With DebugLog=1, one line per change, in <module>.cooldown.log:
;   [sum] slot=9 line=206 count=2
;
; 0 = no count.
ShowSummonCount=1

; Which corner of the button the count sits in.
;   0 = centred, 1 = bottom-right, 2 = top-left (default)
; The default is top-left because the recast number uses centred or
; bottom-right (CooldownPlacement), so the two can never overlap. If you change
; CooldownPlacement, check this still holds.
; The box is only as big as the digits, so the rest of the tile keeps answering
; the mouse - see the long note on CooldownPlacement for why that matters.
SummonCountPlacement=2

; Font of the count. Same index space and the same hard 0..15 limit as
; EffectsFont - anything above 15 crashes the game and is clamped back to 6.
SummonCountFont=6

; Nudge the count (pixels).
SummonCountOffsetX=0
SummonCountOffsetY=0

; NO LONGER USED since v1.19.0. The spell-line flags byte does not encode
; positive vs negative - GameData shows 0x10 on FireShield/Strengthen AND on
; FireBurst/Slowness alike. Kept only so old configs still load.
EffectsPositiveMask=16

; NO LONGER USED since v1.22.0. The portrait no longer follows the mouse:
; the panel's own selection field is read instead, so there is nothing to
; disambiguate. Kept commented out so old configs still load.
;
; DO NOT "complete" this key. It is the one key load_config() reads that is
; deliberately absent, and it must stay absent:
;   - absent -> the loader default 0xFFFFFFFF maps to -1, which means
;     "accept ANY tooltip variant". This is what you want.
;   - writing OverlayVariant=-1 does NOT reproduce that. GetPrivateProfileInt
;     cannot return a negative number; it yields 0, and the mod would then
;     only ever extend variant 0 - i.e. most tooltips silently lose the extra
;     lines. Leave the line commented out.
;OverlayVariant=273

; NO LONGER NEEDED since v1.22.0 (the selection field is known:
; CUiMainDetailView+0x38c, packed as (figure_index << 8) | 1). Left in place
; as a generic "which offset holds this u16" scanner over CUiMain.
ProbeSelection=0

; ---------- Diagnostics (leave all 0 for normal play) ----------

; 1 = write diagnostic lines to sfsf.log and to <module>.debug.log. Also
; enables the per-icon dump ("[eff] icon N (buffK) spell=... x=... y=...")
; in <module>.cooldown.log, which is the fastest way to see what the panel
; is actually holding.
DebugLog=1

; Draws slot numbers 0-9 on the 10 bottom-bar spell buttons (placement test).
RenderTest=0

; STAGE A1 PROBE - bottom-bar spell cooldowns, read side.
; Logs, about once a second, every filled slot of the bar together with the
; figure action it maps onto and the remaining ticks:
;   [bar] slot=3 type=126 sub=1291 -> act=5 a=51230 b=51190 step=51180 rem=50
; rem is in TENTHS of a second (50 = 5.0 s). rem <= 0 means ready.
; act=-1 means the slot's (type, subtype) matched no action on the figure -
; that is the case that decides whether this approach works at all.
; Read-only. Leave at 0 for normal play.
ProbeBarCooldown=0

; XP PROBE - is the "Rewards for killing: Experience N" number the truth?
;
; 1 = watch the avatar's running XP total and, every time it moves, say which
; unit's kill counter moved with it and what each candidate formula predicted.
; Writes to <module>.debug.log (needs DebugLog=1), a handful of lines per kill.
;
; Why it exists. The engine computes the award in AutoClass6::FUN_00625ca0
; (VA 0x00625ca0, sender of net message 0x1f68):
;   n = CDbLocal::vfunction81(player, unit_id)
;   if (n > falloff*10) -> 0
;   else  XP = base*10000 / ((n*100-100)/falloff + 100) / 100
; The mod already does that arithmetic - but it feeds it the AVATAR LEVEL,
; while vfunction81 (VA 0x0064f440) is a per-(player, unit id) KILL COUNTER
; that it increments and returns. So the falloff is meant to be driven by how
; many of that unit type you have already killed, not by your level. The probe
; does not assume that is right either: it logs BOTH predictions next to the
; amount actually paid, and the log settles it.
;
; It never calls vfunction81 (that would increment the counter) - it walks the
; map read-only.
;
; What to do: set this to 1 with DebugLog=1, hover an enemy portrait once (that
; is what warms the map pointers), then kill several of the SAME unit type, one
; at a time. Then run  tools\logs.ps1 extended_tooltip.
;
; Expected shape of the log:
;   [xp] tip uid=882 enemy=1 base=14 falloff=20 lvl=17 shown=9 | killed_so_far=4
;        (player=1) -> next kill should pay 12
;   [xp] total 41230 -> 41242 (gain 12) step=51180 lvl=17
;   [xp]   kill uid=882 player=1 n=4->5 base=14 falloff=20
;          | pred_kills=12 pred_level=9 (lvl=17) | paid=12
; "paid" is the truth. Whichever of pred_kills / pred_level tracks it, wins.
;
; Kill one enemy at a time: two deaths inside the same walk window share one
; "paid" figure (the log then lists both kill lines against that sum).
; A "kill map not located yet" line means the map has no rows yet - hover an
; enemy and kill one thing, it locates itself after that.
ProbeXP=0

; 1 = show the level, damage and range of the unit garrisoning the SELECTED
; building - which for a tower is the thing that actually shoots (default).
;
; Why this is worth showing at all: two towers of the same kind are NOT equally
; strong, and the game shows no sign of it. A finished tower is given a real
; FIGURE (CGdBuildingToolBox::AttachTowerUnit), and its level is copied from the
; OWNER'S AVATAR at that moment, then frozen forever. So a tower raised at hero
; level 1 stays level 1 while an identical one raised later is far stronger.
;
; NOTE, because it is easy to assume otherwise: the level comes from your
; AVATAR, not from the worker who built it. Confirmed two ways - the chain
; building -> owner -> players[owner].avatar_figure_index -> figures[].level
; with all seven offsets checked against the raw listing, and in game on two
; saves: the same tower type came out level 46 on one and level 31 on a save
; with a lower hero. Practical consequence: build towers AFTER levelling, and
; rebuilding an old tower refreshes it.
;
; A tower does NOT attack with its weapon - that is a melee fallback at range
; 1. Its real attack is a SPELL in one of its action slots, and the engine
; picks the variant for the FIGURE'S level, which is why the level is most of
; a tower's strength rather than a label on it. The header line therefore
; reads level, spell name, range and recast:
;
;   Level 50   Boulder   Range 1-15   Every 2.9s
;
; and the spell's own description follows underneath (TowerInfoDesc).
;
; Why no "Damage N" on the header line, since 1.35.0: there is no parameter
; that always means damage. Each spell LINE has its own description template
; and they disagree - Boulder spends params[0] on damage, Healing Ray on
; healing, Hypnotizing Gaze on one factor of a duration. 1.34.x printed
; params[0] as "Damage" and a hypnotize tower came out as "Damage 2000", which
; is 2000 milliseconds. The description line is rendered by the engine's own
; expander, so every number in it is whatever that line says it is.
;
; And the non-fix, recorded so it is not tried: do NOT filter on plausibility.
; A level 13 tower legitimately deals 15000 damage, so any "that looks too
; big" clamp would hide a correct value to suppress an incorrect one.
;
; A garrisoned building with no spell still shows its effective weapon damage
; with the raw numbers in brackets - "Damage 40-76 (18-36)", the same idiom
; the production tooltip uses, scaled by the engine's own arithmetic:
;   lvl_mult = per-level damage multiplier from CGdResource
;   str_mult = strength * 3 * (level + 9)
;   damage   = raw * str_mult * lvl_mult / 100000
;
; The panel is found from the selection handle at detail+0x38c, whose low byte
; is 2 for a BUILDING (1 = figure). That value is not in the listing anywhere
; useful - it came from ProbeSelTag below.
;
; 0 = show nothing on the building panel.
ShowTowerInfo=1

; Where the block sits on the building panel, in the panel's own coordinates
; (which are 1:1 pixels: TowerInfoX=300 puts the text 300 px from the panel's
; left edge). There is no way to know from the code what part of that panel is
; free, so this is a setting rather than a guess - nudge it until it looks
; right. The box is only as big as the text, so it cannot swallow the panel's
; own mouse handling (see the long note on CooldownPlacement for why).
;
; The default is the framed strip along the BOTTOM of the panel, starting just
; right of the portrait box (which ends around x=320). 1.35.0 defaulted to
; y=8, near the panel's top, where the panel is transparent - the text floated
; over the map instead of sitting in the frame.
;
; The strip is short, around 60 px, which is under three lines at font 6 - so
; the text is meant to run sideways, not downwards. That is what the wide
; TowerInfoWrap below is for. With DebugLog=1 the log prints the panel's own
; measured rect next to these values:
;   [tw]   panel rect: x=0 y=842 w=1606 h=235, block at 340,172 pitch 22
; so the strip's bottom edge is h, and the block must end above it.
TowerInfoX=340
; The strip runs from roughly y=172 down to the panel's bottom edge at 235, so
; it is 63 px tall - and three lines at font 6's own 22 px line height need 66.
; The block therefore starts a few pixels ABOVE the strip's top edge, where a
; short header line does no harm, so that the third line stops short of the
; panel's bottom instead of hanging off it. Raise this number to push the
; block down, lower it to pull it up.
TowerInfoY=166

; Font of that line. Same index space and hard 0..15 limit as EffectsFont.
TowerInfoFont=6

; 1 = also show the spell's OWN description under the header line (default),
; expanded by the engine so the numbers are correct and localized:
;
;   Level 50   Boulder   Range 1-15   Every 2.9s
;   Affected unit takes 569 damage. This damage is reduced by armor.
;
; 0 = header line only. Turn it off if the panel has no room for it.
;
; The header's "Life a/b" is the BUILDING's, not the garrison figure's. Those
; are two separate entities with separate pools, and an attacker destroys the
; building. 1.36.0 read the figure - through getCurrentStat(HEALTH), which is
; exactly what the game's own portrait Life line uses, so the call was right
; and the entity was wrong - and the numbers missed the game's debug readout
; in both directions at once: Spitflower 417 against 275, Tower of Sorcery
; 121 against 694. No single factor relates those, which is what says two
; different things are being measured rather than one being scaled wrongly.
;
; A name is not always available: spell line 171 (Black Tower) points at text
; 27471, which exists only in language 0, so an English game has nothing to
; show. The header then simply drops the name - "Level 13   Range 1-15   Every
; 5.0s" - rather than printing the engine's own "#27471 <has no entry> Res"
; placeholder, which is what 1.35.0 did. The description still says what the
; spell does, so nothing the player needs is lost.
TowerInfoDesc=1

; Vertical pitch between those lines, in the panel's own coordinates. A
; CMnuLabel is one line, so the description is spread over up to five of
; them. Font 6 reports a 22 px line height; the default is deliberately one
; notch tighter so that three lines fit the 63 px strip at all. Raise this if
; the lines overlap, lower it if they are too far apart.
;
; TWO PLACES WHERE THE MOD WRITES THE TEXT ITSELF, and both are filled from
; the engine handler rather than from what a neighbouring spell does:
;
;  * Spell line 75, Acid Cloud - the Spitflower and Great Spittower line.
;    GameData gives it description_id 0, so the game has NO text for it and
;    the panel showed nothing at all. CGdSpell::effect_acid_cloud settles
;    every parameter: [0] is the radius (SetRectFromRadius), [1] the interval
;    (to_do_count = p1*10/1000), [2] the tick count (the loop ends when the
;    counter reaches it), [3] the damage per tick (DealDamage). So the
;    Spitflower's [6,1000,10,20] is 20 damage a second for 10 seconds in an
;    area of 6. That last figure is a radius in MAP SQUARES - the same unit
;    the header's Range field uses - and it is phrased "in an area of N"
;    because that is the game's own wording for it, in spell line 171's text.
;    It can exceed the spell's Range (Great Spitflower is Range 0-4, area 6):
;    Range is how far the tower may pick a target, the cloud it drops is
;    wider, so whatever stands behind the target is caught as well.
;
;  * Spell line 143, ArrowTower - Crossbow and Archer Tower. Its own text says
;    only "Inflicts N damage", which reads as though armor were ignored.
;    effect_tower_arrow computes damage = (reduction * params[0] + 5000)/10000
;    with reduction from AC34::calculate_physical_damage_reduction_maybe, so
;    the sentence "This damage is reduced by armor." is appended - the same
;    thing Boulder's own text already says about itself.
;
; Any other line with no description is LOGGED with its id and parameters
; instead of being guessed at, so the next entry comes from a handler too.
TowerInfoLineH=20

; Characters per description line before it wraps. Range 8..200.
;
; The default is deliberately wide: the strip the block sits in is short but
; runs the full width of the panel, so the text has far more room sideways
; than downwards. At 46 the longest tower description in the game (line 171,
; 165 characters) needed four lines and got cut off; at 110 it needs two.
; Lower it if the text runs off the right edge of the panel.
;
; IGNORED while TowerInfoAlignBar=1 - see below.
TowerInfoWrap=110

; 1 = take the block's left edge and its wrap width from the action bar's own
; buttons instead of from TowerInfoX / TowerInfoWrap (default).
;
; This is the frame the avatar's spell buttons appear in, so the frame's
; usable area is not a constant worth guessing - it is action button 0's and
; button 9's live rects, and the mod already reads those for the recast
; countdowns. Both containers' own rects convert between their coordinate
; spaces: panel_x = (cuibottom.x + button.x) - detail.x. Every input is in the
; log line, so the result is checkable:
;   [tw]   panel rect: x=0 y=842 w=1606 h=235, block at 369,172 pitch 22
;          wrap 93 (bar x=369 wrap=93)
;
; Why it exists: 1.35.1's x=340 was measured off a screenshot, overhung the
; frame's left ornament, and would have been wrong at any other resolution.
;
; TowerInfoY is NOT affected - the vertical position stays yours to set.
;
; 0 = use TowerInfoX and TowerInfoWrap literally.
TowerInfoAlignBar=1

; TOWER GROUNDWORK - dumps the panel's RAW selection handle whenever it changes.
;
; Needs DebugLog=1 and RenderEffects=1 (it sits where that code already reads
; the field). Writes to <module>.debug.log:
;   [tw] sel=02cb0002 tag=2 idx=715 panel_on=1
;   [tw]   fig=812 claims building 154: level=33 unit=849 owner=1
;
; Why it exists. A tower is selected as a BUILDING, not a figure - confirmed
; both ways: the game's own debug says "Selected Building: 154 (Type:13)", and
; our portrait hook logged nothing but the avatar when a tower was clicked. The
; panel refresher (FUN_00a49b10) bails unless the handle's low byte is 1
; (figure), so the building tag value is simply not known yet. Rather than read
; more listing, this logs the whole word and lets the game answer.
;
; It deliberately runs OUTSIDE the "panel active" gate: +0x390 is only known to
; read 1 for a figure, so gating on it could silence the probe for exactly the
; case it exists to identify.
;
; The second line is the payoff. AttachTowerUnit shows a tower gets a real
; FIGURE, with its level copied from the OWNER'S AVATAR at build time
; (building -> owner -> players[owner].avatar_figure_index -> figures[].level,
; all seven offsets verified against the listing). So a tower built while your
; avatar was level 1 stays level 1 forever - which is the effect you noticed,
; though the cause is the avatar and not the worker. The probe walks for a
; figure whose `building` field matches the selected index, which is the reverse
; key, and prints its level and unit id - validating the whole chain in one
; click.
;
; Leave at 0 for normal play.
ProbeSelTag=1

; ACTION-BUTTON HINT PROBE - groundwork for the melee comparison tooltip that
; the 1.54 extended_ui showed on the sword icon ("A vs B / Melee combat /
; Damage / DPS / Chance to hit").
;
; Everything that mod did is now mapped, and the two engine facts are pinned:
;   * Chance to hit is AutoClass34::FUN_00717860(ac34, attacker, target). It
;     has no name in the listing - what identifies it is that the attack
;     resolver compares its result against Random(100) and calls "below" a
;     miss. extended_ui called the same function at its 1.54 address, so both
;     sides agree.
;   * The control is one of the ten buttons this mod ALREADY owns: they are
;     built as "<Ctrl>btnAction%u" into CUiBottom+0x39c, which is the very
;     array the recast countdowns hang on. extended_ui matched that name, so
;     that button's hint is the tooltip in question. The hint itself is an
;     SF_String at CMnuBase+0x18c (CMnuBase::SetHint does nothing but assign
;     it), so it can be read now and written later.
;
; Two things remain, and both are runtime facts that no amount of listing can
; answer - hence a probe rather than a guess:
;   1. WHICH of the ten buttons is the attack one.
;   2. WHETHER the engine rewrites that hint, and how often. If it does, our
;      text has to be re-applied every tick; if not, once per selection.
;
; With this at 1, <module>.cooldown.log gets:
;   [ah] ref 4375='Attack the selected target. ...'
;   [ah] --- step=51180 ---
;   [ah] btn 0 hint='...'
;   [ah] btn 4 hint='Attack the selected target...'  <== ATTACK (4375)
; The reference strings are fetched through the engine's own GetTextById, so
; the match works in any language. Lines appear ONLY when a hint changed, so
; the file also shows how often the engine rewrites them - which is the
; second question. Read-only.
;
; Leave at 0 for normal play. Turned back off once it had answered: the
; buttons carry no hint, no flag bit tracks the cursor, and the hint the game
; renders belongs to a CMnuScreen the mod does not hold. That is why the
; comparison landed on the portrait tooltip instead - see ShowHitChance.
ProbeActionHint=0

; Read-only probes; each logs to <module>.cooldown.log.
;   ProbeCooldown - dumps the figure's action slots and their cooldown words
;   ProbeDuration - dumps every timed effect on nearby figures
;   ProbeCanCast  - logs what the engine passes to the bottom-bar cast check
;   ProbeUI       - walks Global_CAppMain -> CUiMain -> CUiBottom once
;   ProbeHints    - entry hook on CMnuBase::SetHint. ANSWERED, keep it off:
;                   only static UI labels go through it (Equipment, Runes,
;                   Gold; tags 0x100-0x104 and 0x200-0x204 are tab numbers),
;                   set once when a screen is built. The item description
;                   never passes through it - the game has two hint
;                   mechanisms and items use the other one.
;   ProbeHintExt  - entry hook on CMnuHintExt::vfunction204, the other one:
;                   it ends in CMnuLabel::SetString, so it is the last point
;                   the item description passes before it is on screen. It
;                   ANSWERED and shipped as ShowItemDPS below; this key now
;                   only turns the logging back on. The hook itself goes in
;                   whenever ShowItemDPS is set, so leaving this at 0 costs
;                   nothing.
ProbeCooldown=0
ProbeDuration=0
ProbeCanCast=0
ProbeUI=0
ProbeHints=0
ProbeHintExt=0

; ShowItemDPS - DPS on the INVENTORY ITEM tooltip, appended to the end of the
; engine's own "Weapon Stats: Damage .. Range .. Speed ..%" line.
; Dual wielding is worth +25% weapon speed (handoff 23.2b) and the rate is
; computed for the character the tooltip was built for: the bonus is applied
; only when the item is one-handed AND that character already holds a
; one-handed weapon in BOTH hands, i.e. when equipping it cannot break the
; pair. A two-hander or a bow ends dual wielding, and a character with one
; hand free is genuinely ambiguous - both stay on the standalone rate.
; The scaled damage is recomputed and matched against the number the engine
; already printed, so a mismatch (wrong character, non-weapon) simply appends
; nothing rather than showing an invented figure.
ShowItemDPS=1

; Note: since v0.3.0 the allied short tooltip is ALWAYS promoted to the
; full enemy layout (Level, Life, weapon blocks with effects, Spells) and
; the extra lines are appended to every variant. The former keys
; FullAllyTooltip, OnlyDetailedTooltip and HoldCtrl are ignored.
